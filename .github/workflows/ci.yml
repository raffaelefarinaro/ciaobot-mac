name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build
        run: swift build
      - name: Build local app bundle
        run: scripts/build-app.sh
      - name: Verify packaged assets and icon
        run: swift test --filter AppAssetsTests
      - name: Validate bundle metadata
        run: plutil -lint .build/Ciaobot.app/Contents/Info.plist
